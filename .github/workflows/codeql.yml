name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Build time 5x fast kar dega

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Option 1: Fast Artifact Download (Zip file download hogi Actions Tab se)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSLauncher-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # Option 2: Direct APK Download (GitHub Releases Tab pe direct .apk file milegi)
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
